[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.28"
# Mantle (OP-Stack derived) has Cancun opcodes since the Ecotone/Tectonic upgrades.
# OZ 5.6 emits MCOPY (memory-copy, not transient storage), so cancun is required.
# DEPLOY-DAY CHECK: re-confirm Mantle Sepolia accepts MCOPY before the demo.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [
    { access = "read", path = "./" },
    { access = "write", path = "./deployments" },
]

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[profile.ci]
verbosity = 3
fuzz = { runs = 1000 }
invariant = { runs = 128, depth = 96 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
sort_imports = true

[rpc_endpoints]
mantle_sepolia = "${MANTLE_SEPOLIA_RPC_URL}"
mantle = "${MANTLE_MAINNET_RPC_URL}"

# Mantlescan moved to the Etherscan API V2 multichain endpoint; the old per-host V1 URLs are dead.
# Verify with:  forge verify-contract <addr> <fqname> --chain 5003 --watch   (MANTLESCAN_API_KEY in env)
[etherscan]
mantle_sepolia = { key = "${MANTLESCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=5003", chain = 5003 }
mantle = { key = "${MANTLESCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=5000", chain = 5000 }
